spring.application.name=kantor-backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/kantor
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZyB0aGF0IGlzIGF0IGxlYXN0IDI1NiBiaXRz
jwt.expiration=86400000

# NBP API Configuration
nbp.api.url=https://api.nbp.pl/api

# Server Configuration
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info
